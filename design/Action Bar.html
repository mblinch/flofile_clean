<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Action Bar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
*{box-sizing:border-box;margin:0}
body{background:#0B0D0F;color:#E8EEF4;font:13px/1.4 Inter,system-ui,sans-serif;padding:24px 24px 24px;min-height:100vh;justify-content:flex-end;display:flex;flex-direction:column;align-items:center;gap:14px;-webkit-font-smoothing:antialiased}
a{color:#E8EEF4}a:hover{color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.cmp{display:flex;align-items:center;gap:10px;color:#6A6E73;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;background:#1E242A;border-radius:8px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1px rgba(232,238,244,.12)}
.seg button{white-space:nowrap;height:26px;padding:0 12px;border-radius:6px;color:#959AA0;font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}
.seg button.on{background:#20313C;color:#fff;box-shadow:inset 0 0 0 1px #3A6076}
.old{display:none;width:100%;max-width:873px;border-radius:10px}
body.before .old{display:block}body.before .bar{display:none}
.bar{width:100%;max-width:873px;background:#14181C;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(232,238,244,.10);padding:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
/* save pair */
.pair{display:flex;align-items:stretch;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(74,122,150,.95),0 0 16px rgba(74,122,150,.25);overflow:hidden}
.prev{height:40px;padding:0 12px 0 10px;border-radius:10px;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:#BFD3DF;background:#15222B;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(74,122,150,.6)}
.prev:hover{background:#1C2D38;color:#fff}
.next{height:40px;padding:0 12px 0 16px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(74,122,150,.95),0 0 16px rgba(74,122,150,.25);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#fff;white-space:nowrap;background:linear-gradient(#243848,#15242E 55%,#0E181F)}
.next:hover{background:linear-gradient(#2E4658,#1A2E3A 55%,#121F28)}
.next:active{background:linear-gradient(#1A2A36,#0C141A 55%,#080E12)}
.prev i,.next i{font-size:14px}
kbd{font:600 10.5px Inter;color:#BFD3DF;background:rgba(232,238,244,.06);border:1px solid rgba(232,238,244,.18);border-radius:4px;padding:1px 5px}
.burst{height:40px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;white-space:nowrap;color:#E8EEF4;background:rgba(232,197,71,.06);box-shadow:inset 0 0 0 1px rgba(232,197,71,.45)}
.burst:hover{background:rgba(232,197,71,.12)}
.burst>i{color:#E8C547;font-size:14px}
.burst .n{background:#E8C547;color:#1A1606;border-radius:4px;font-size:11px;font-weight:700;padding:0 5px;line-height:17px}
.burst kbd{color:#959AA0;border-color:rgba(232,238,244,.12)}
.sp{flex:1}
.tools{display:flex;align-items:center;gap:1px;background:#1E242A;border-radius:10px;padding:3px;box-shadow:inset 0 0 0 1px rgba(232,238,244,.08)}
.ti{position:relative;width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:#959AA0;font-size:16px}
.ti:hover{background:#2A3035;color:#E8EEF4}
.ti[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:42px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#262D35;color:#E8EEF4;font-size:11.5px;font-weight:500;padding:5px 8px;border-radius:6px;box-shadow:0 0 0 1px rgba(232,238,244,.16),0 8px 20px rgba(0,0,0,.45);pointer-events:none;z-index:5}
.tdv{width:1px;height:18px;background:rgba(232,238,244,.10);margin:0 3px}
.ftp{height:40px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap;color:#E8EEF4;background:#1E242A;box-shadow:inset 0 0 0 1px rgba(232,238,244,.12)}
.ftp:hover{background:#262D35}
.ftp i{font-size:15px;color:#959AA0}
.ftp span{color:#959AA0;font-weight:500}
.hw{position:relative}
.hp{position:absolute;bottom:46px;left:50%;transform:translateX(-50%);width:400px;background:#1E242A;border-radius:11px;box-shadow:0 0 0 1px rgba(232,238,244,.14),0 18px 44px rgba(0,0,0,.55);padding:5px;display:none;z-index:20}
.hp.open{display:block}
.hh{display:flex;align-items:center;justify-content:space-between;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6A6E73;padding:7px 9px 5px}
.hh span{letter-spacing:0;text-transform:none;font-weight:500}
.hi{width:100%;display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:start;column-gap:8px;padding:8px 9px;border-radius:7px;text-align:left}
.hi:hover,.hi.k{background:#262D35}
.hi .n{font:600 10.5px Inter;color:#6A6E73;line-height:19px;text-align:center;border:1px solid rgba(232,238,244,.12);border-radius:4px;height:18px}
.hi .t{font-size:13px;line-height:19px;color:#D8DEE4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hi .t b{color:#fff;font-weight:500}
.hi .t em{font-style:normal;color:#9FC3D6}
.hi .m{font-size:11px;color:#6A6E73;line-height:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.hf{font-size:11px;color:#6A6E73;padding:6px 9px 5px;border-top:1px solid rgba(232,238,244,.08);margin-top:3px}
#hb.open{background:#2A3035;color:#E8EEF4}
#hb.open::after{display:none}
</style></head><body>
<div class="cmp">View<div class="seg" id="vw"><button data-v="after" class="on">Redesign</button><button data-v="before">Current</button></div></div>
<img class="old" src="uploads/Screenshot 2026-11-26 at 2.56.00 PM.png" alt="Current">
<div class="bar">
<button class="prev" title="Save & previous"><i class="ph-bold ph-caret-left"></i>Save</button><div class="tools"><button class="ti" data-tip="Copy caption"><i class="ph ph-copy"></i></button><button class="ti" data-tip="Paste caption"><i class="ph ph-clipboard-text"></i></button><button class="ti" data-tip="Paste last caption ⌘⇧V"><i class="ph ph-arrow-bend-down-left"></i></button><span class="tdv"></span><div class="hw"><button class="ti" id="hb" data-tip="Caption history"><i class="ph ph-clock-counter-clockwise"></i></button><div class="hp" id="hp"><div class="hh">Recent captions<span>Last 5</span></div><div id="hl"></div><div class="hf">Template text (dateline, venue, credit) is added automatically</div></div></div><button class="ti" data-tip="Refresh"><i class="ph ph-arrow-clockwise"></i></button></div><button class="next">Save &amp; next<kbd>↵</kbd><i class="ph-bold ph-caret-right"></i></button>
<button class="burst"><i class="ph-fill ph-lightning"></i>Save to Burst<span class="n">4</span></button>
<span class="sp"></span>

<button class="ftp"><i class="ph ph-cloud-arrow-up"></i><span>FTP:</span>Photoshelter</button>
</div>
<script>
const HC=[
['Anthony Stolarz #41','comes off the ice','Buffalo Sabres','first period','0:12'],
['Auston Matthews #34','shoots','Buffalo Sabres','first period','1:48'],
['Morgan Rielly #44 and Chris Tanev #8','battle','Rasmus Dahlin #26','first period','3:05'],
['William Nylander #88','celebrates a goal','Buffalo Sabres','first period','4:31'],
['John Tavares #91','takes a faceoff','Tage Thompson #72','first period','6:10']];
document.getElementById('hl').innerHTML=HC.map(([p,v,o,per,ago],i)=>`<button class="hi" data-i="${i}"><span class="n">${i+1}</span><span class="t"><b>${p}</b> <em>${v}</em> against ${o} during the ${per}</span><span class="m">${ago} ago</span></button>`).join('');
const hb=document.getElementById('hb'),hp=document.getElementById('hp');
hb.onclick=e=>{e.stopPropagation();hp.classList.toggle('open');hb.classList.toggle('open')};
document.addEventListener('click',e=>{if(!e.target.closest('.hw')){hp.classList.remove('open');hb.classList.remove('open')}else if(e.target.closest('.hi')){hp.classList.remove('open');hb.classList.remove('open')}});
addEventListener('keydown',e=>{if(!hp.classList.contains('open'))return;if(e.key==='Escape'){hp.classList.remove('open');hb.classList.remove('open')}if(/^[1-5]$/.test(e.key)){hp.classList.remove('open');hb.classList.remove('open')}});
document.getElementById('vw').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;document.body.classList.toggle('before',b.dataset.v==='before');document.querySelectorAll('#vw button').forEach(x=>x.classList.toggle('on',x===b))};
</script>
</body></html>
