<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit photo (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0f1114}
a{color:#8fb6e0}a:hover{color:#b9d3ef}
.tool{flex:1;height:44px;border:0;border-radius:10px;background:#22262c;color:#e9edf2;font-family:Inter,sans-serif;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.sl{display:flex;align-items:center;gap:10px;height:40px}
.sl span{font-size:13px;color:#c7cdd4}
.sl input{flex:1;accent-color:#f2f4f7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0f1114; color: #e9edf2; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="height: 52px; display: flex; align-items: center; padding: 0 8px; gap: 4px; border-bottom: 1px solid #1f2328; flex-shrink: 0">
    <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; padding: 0 10px; color: #e9edf2; font-size: 15px; font-weight: 600; text-decoration: none">Cancel</a>
    <div style="flex: 1; text-align: center; font-size: 16px; font-weight: 800">Edit photo</div>
    <a href="Main.dc.html" style="height: 36px; display: flex; align-items: center; padding: 0 14px; border-radius: 8px; background: #f2f4f7; color: #0f1114; font-size: 14px; font-weight: 800; text-decoration: none">Save</a>
  </div>

  <div style="height: 260px; flex-shrink: 0; background: #000; display: flex; align-items: center; justify-content: center">
    <img src="/_blob/fbd68c98fad48601f59b54a30d13e972" alt="Photo being edited" style="width: 390px; height: 260px; object-fit: cover; display: block">
  </div>

  <div style="display: flex; gap: 6px; padding: 10px 14px; flex-shrink: 0">
    <button class="tool">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg>Crop</button>
    <button class="tool">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Rotate</button>
    <button class="tool">Before / after</button>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: #8a929c; margin: 12px 0 2px">{{g.name}}</div>
      <sc-for list="{{g.items}}" as="s" hint-placeholder-count="3">
        <label class="sl">
          <span style="width: 92px">{{s.name}}</span>
          <input type="range" min="-100" max="100" value="0">
          <span style="width: 28px; text-align: right; color: #8a929c">0</span>
        </label>
      </sc-for>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 18px; border-top: 1px solid #1f2328; background: #121418">
    <span style="font-size: 12px; color: #8a929c">LFS-MDB-261117-vsOTT-0413.jpg</span>
    <button style="height: 36px; border: 0; background: transparent; color: #8fb6e0; font-family: Inter, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Reset all</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = [['WHITE BALANCE', ['Temp', 'Tint']], ['LIGHT', ['Exposure', 'Contrast', 'Highlights', 'Shadows', 'Whites', 'Blacks']], ['COLOR', ['Vibrance', 'Saturation']]];
    return { groups: G.map(([name, items]) => ({ name, items: items.map((n) => ({ name: n })) })) };
  }
}
</script>
</body>
</html>
